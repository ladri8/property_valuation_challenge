version: '3.9'

services:
  pipeline:
    build:
      context: .
      dockerfile: Dockerfile.pipeline
    container_name: property_pipeline
    volumes:
      - ./data:/app/data
      - ./models:/app/models 
    environment:
      - PYTHONPATH=/app/src
      - PREFECT_API_SERVE_EPHEMERAL_SERVER=false
    restart: "no"  # stop after pipeline runs

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: property_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      pipeline:
        condition: service_completed_successfully
    volumes:
      - ./models:/app/models  # mount model artifacts
    environment:
      - PYTHONPATH=/app/src
    restart: unless-stopped
