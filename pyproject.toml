# This file is the central config for:
#   build system
#   project metadata 
#   setuptools package discovery

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "propval"  
version = "0.1.0"
description = "ML pipeline for property valuation"
authors = [{name = "Adriana RM"}]
readme = "README.md"
requires-python = ">=3.10"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
