[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "property_valuation"  
version = "0.1.0"
description = "ML pipeline for property valuation"
authors = [
  { name="Adriana E Reye Miranda"}
]
readme = "README.md"
requires-python = ">=3.10"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
